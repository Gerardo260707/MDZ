<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaicos</title>
  <link rel="stylesheet" href="assets.css" />
</head>
<body>
  <main class="site">
    <header class="top">
      <div class="brand-row">
        <div class="logo"><small>// Mosaicos</small>Dzununcán</div>
        <div class="langs"><span data-i18n="lang_label">Idioma</span> ▪
          <button class="lang-btn" data-set-lang="es" data-lang-active="es">🇲🇽</button>
          <button class="lang-btn" data-set-lang="en" data-lang-active="en">🇺🇸</button>
        </div>
      </div>
      <nav>
        <a data-keep-lang href="index.html" data-i18n="nav_home">Inicio</a>
        <a data-keep-lang href="mosaicos.html" data-i18n="nav_mosaics">Mosaicos</a>
        <a data-keep-lang href="galeria.html" data-i18n="nav_gallery">Galería</a>
        <a data-keep-lang href="mantenimiento.html" data-i18n="nav_maintenance">Mantenimiento</a>
        <a data-keep-lang href="instalacion.html" data-i18n="nav_installation">Instalación</a>
        <a data-keep-lang href="contacto.html" data-i18n="nav_contact">Contacto</a>
        <a data-keep-lang class="btn" href="pago.html" data-i18n="nav_pay">Pago Clip</a>
      </nav>
    </header>
    <div class="mosaic-strip"></div>

    <section>
      <h2 data-i18n="cat_title">Mosaicos Hidráulicos</h2>
      <h3 data-i18n="cat_subtitle">Generales de los ladrillos</h3>
      <p data-i18n="cat_desc">Fabricamos artesanalmente cada mosaico de pasta en diferentes medidas y categorías.</p>
      <div class="category-grid" id="catGrid"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const lang = window.siteI18n.getLang();
    const categories = [
      { key:'cat_colors', img:'assets/placeholder-tile.svg', href:'galeria.html' },
      { key:'cat_decorated', img:'assets/placeholder-tile.svg', href:'mosaicos.php' },
      { key:'cat_specials', img:'assets/placeholder-tile.svg', href:'galeria.html' },
      { key:'cat_customize', img:'assets/placeholder-tile.svg', href:'personalizar.php?id=1' }
    ];
    const dict = { es:{cat_colors:'Lisos',cat_decorated:'Decorados',cat_specials:'Especiales',cat_customize:'Personalizar',btn:'Ver modelos » clic aquí'}, en:{cat_colors:'Solid Colors',cat_decorated:'Decorated',cat_specials:'Specials',cat_customize:'Customize',btn:'View models » click here'} };
    const t = dict[lang] || dict.es;
    const el = document.getElementById('catGrid');
    categories.forEach(c=>{
      const card = document.createElement('article');
      card.className='category-card';
      const href = c.href + (c.href.includes('?') ? '&' : '?') + 'lang=' + lang;
      card.innerHTML = `<img src="${c.img}" alt="${t[c.key]}"/><h3>${t[c.key]}</h3><a href="${href}">${t.btn}</a>`;
      el.appendChild(card);
    });
  </script>
</body>
</html>
